name: Auto Claude Market Review

on:
  workflow_dispatch:           # 수동 실행 버튼
    inputs:
      market:
        description: '분석할 시장 (kr 국내 / us 미국 / jp 일본 / cn 중국)'
        required: true
        default: 'kr'
        type: choice
        options: [kr, us, jp, cn]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Determine markets
        id: mkt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "markets=${{ github.event.inputs.market }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "40 6 * * 1-5" ]; then
            echo "markets=kr jp" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 21 * * 1-5" ]; then
            echo "markets=us" >> "$GITHUB_OUTPUT"
          else
            echo "markets=cn" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate & publish reviews
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 한 시장이 실패해도 나머지는 계속 돌리되, 끝에서 job 을 실패로 만든다.
          # 예전 `|| echo "::warning::"` 는 실패를 삼켜서 런이 항상 success 로 보였다
          # (generate_review.py 의 NameError 가 그래서 오래 안 드러났다).
          failed=""
          for m in ${{ steps.mkt.outputs.markets }}; do
            echo "=================== $m ==================="
            if ! python generate_review.py --market "$m"; then
              echo "::error::$m 리뷰 실패"
              failed="$failed $m"
            fi
          done
          if [ -n "$failed" ]; then
            echo "리뷰 실패 시장:$failed"
            exit 1
          fi
