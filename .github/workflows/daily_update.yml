name: Daily Market Data Update

on:
  schedule:
    - cron: '*/5 * * * *'    # 5분마다 (public 저장소 무제한)
  workflow_dispatch:           # 수동 실행 버튼

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install -r requirements.txt

      # 각 시장은 서로 독립이다. continue-on-error 가 없으면 한 시장의 외부 사이트
      # 장애가 뒤 스텝을 전부 skip 시켜 대시보드 전체가 멈춘다.
      #   실측: 2026-08-01(토) 네이버 접속 불가로 KR 이 죽고 US/JP/CN/FX 가 10시간 반 skip.
      # 실패 자체는 마지막 스텝에서 모아 job 을 빨갛게 만든다.
      - name: Fetch KR data
        id: kr
        continue-on-error: true
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python fetch_kr.py

      - name: Fetch US data
        id: us
        continue-on-error: true
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python fetch_us.py

      - name: Fetch JP data
        id: jp
        continue-on-error: true
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python fetch_jp.py

      - name: Fetch CN data
        id: cn
        continue-on-error: true
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python fetch_cn.py

      - name: Fetch FX rates
        id: fx
        continue-on-error: true
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python fetch_fx.py

      # 대시보드 '🔄 리뷰 갱신' 버튼이 Firebase 에 남긴 요청을 여기서 처리한다.
      #   버튼은 GitHub Actions 를 직접 부를 수 없다 — actions:write 토큰이 필요한데
      #   그 페이지는 공개라 소스에 넣으면 그대로 노출된다. 그래서 요청만 남기고
      #   5분마다 도는 이 워크플로가 집어간다(트리거 PC 를 손댈 필요가 없다).
      #   pop_review_requests.py 는 꺼내면서 바로 지운다 — 리뷰 생성이 4~6분이라
      #   다음 tick 과 겹쳐도 같은 요청을 두 번 집지 않는다.
      #   요청이 없으면 몇 초 만에 끝난다.
      - name: Handle manual review requests
        continue-on-error: true
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          markets=$(python pop_review_requests.py)
          if [ -z "$markets" ]; then exit 0; fi
          echo "수동 리뷰 갱신 요청:$markets"
          for m in $markets; do
            echo "=================== $m (수동 요청) ==================="
            python generate_review.py --market "$m" --force \
              || echo "::warning::$m 수동 리뷰 갱신 실패"
          done

      - name: Report failures
        if: always()
        run: |
          failed=""
          if [ "${{ steps.kr.outcome }}" != "success" ]; then failed="$failed kr"; fi
          if [ "${{ steps.us.outcome }}" != "success" ]; then failed="$failed us"; fi
          if [ "${{ steps.jp.outcome }}" != "success" ]; then failed="$failed jp"; fi
          if [ "${{ steps.cn.outcome }}" != "success" ]; then failed="$failed cn"; fi
          if [ "${{ steps.fx.outcome }}" != "success" ]; then failed="$failed fx"; fi
          if [ -n "$failed" ]; then
            echo "::error::수집 실패:$failed (나머지 시장은 정상 갱신됨)"
            exit 1
          fi
          echo "전 시장 수집 성공"
